<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平板連線測試</title><style>body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;max-width:720px;margin:40px auto;padding:20px;background:#f7f3e8;color:#263238}.box{background:#fff;border-radius:20px;padding:24px;border:1px solid #ded2b9}.ok{color:#247044}.warn{color:#a15b14}.btn{display:inline-block;padding:12px 18px;background:#263238;color:#fff;border-radius:12px;text-decoration:none;font-weight:700}</style></head><body><div class="box"><h1>📱 平板連線測試</h1><p class="ok">✅ 如果你看得到這一頁，iPad 已經成功連到筆電上的離線教材。</p><p id="mic"></p><p><a class="btn" href="START_HERE.html">進入教材</a></p></div><script>const el=document.getElementById('mic'); if(window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){el.className='ok';el.textContent='✅ 這個瀏覽器環境允許網頁要求麥克風。';}else{el.className='warn';el.textContent='📱 目前是離線區網模式。iPad 不提供網頁錄音時，教材會自動切換成「口頭念出 → 聽標準音 → 自評」，練習不會卡住。';}</script></body></html>
